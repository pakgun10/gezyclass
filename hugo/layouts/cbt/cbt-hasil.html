<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--page-bg);color:var(--text);min-height:100vh}
.box{max-width:760px;margin:32px auto;background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
.box h2{font-size:22px;margin-bottom:8px;text-align:center}
.box p{color:var(--sub);font-size:14px;text-align:center;margin-bottom:18px}
.box label{display:block;font-weight:600;margin:14px 0 4px}
.box input{width:100%;padding:12px 14px;border:1px solid var(--input-border);border-radius:10px;font-size:16px;background:var(--input-bg);color:var(--text)}
.box button{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:18px}
.box button.ghost{background:var(--btn-ghost);color:var(--btn-ghost-text);margin-top:10px}
.small{font-size:13px;color:var(--sub);text-align:center;margin-top:10px}
.loading{text-align:center;padding:40px;color:var(--sub);font-size:17px}
.rekap-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.rekap-head h2{font-size:20px}
.badge{display:inline-block;background:var(--amber-bg);color:var(--amber-text);font-size:11px;padding:2px 10px;border-radius:12px}
table{width:100%;border-collapse:collapse;margin:10px 0 20px;font-size:14px}
th,td{border:1px solid var(--row-border);padding:8px 10px;text-align:left}
th{background:var(--thead-bg);font-weight:600}
tr:nth-child(even){background:rgba(0,0,0,0.02)}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}
.chip.submitted{background:var(--green-bg);color:var(--green)}
.chip.ongoing{background:var(--amber-bg);color:var(--amber-text)}
.exam-card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.exam-card h3{font-size:17px;margin-bottom:4px}
.exam-card .meta{font-size:13px;color:var(--sub);margin-bottom:12px}
.btn-line{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.btn-line button{flex:0 0 auto;padding:9px 16px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.btn-csv{background:var(--accent);color:#fff}
.btn-print{background:var(--btn-ghost);color:var(--btn-ghost-text)}
.wrap-table{overflow-x:auto}
.pagination{display:flex;flex-direction:row;justify-content:center;align-items:center;gap:5px;flex-wrap:nowrap;overflow-x:auto;margin:14px 0 4px;padding:2px 0}
.pagination button{flex:0 0 auto;width:auto;min-width:32px;height:32px;padding:4px 8px;margin:0;border:1px solid var(--card-border);border-radius:7px;background:var(--card);color:var(--text);font-size:13px;font-weight:600;line-height:1;cursor:pointer}
.pagination button:hover:not(:disabled),.pagination button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pagination button:disabled{opacity:.45;cursor:not-allowed}
.pagination .ellipsis{flex:0 0 auto;min-width:20px;text-align:center;color:var(--sub);font-size:13px}
.pagination-info{font-size:13px;color:var(--sub);text-align:center;margin-top:8px}
.hidden{display:none}
.tab{display:flex;gap:8px;margin-bottom:16px}
.tab a{padding:9px 18px;border-radius:8px;border:1px solid var(--card-border);background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.tab a.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.link-pill{display:inline-block;font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:10px;padding:2px 8px;margin-left:6px;cursor:pointer;background:none}
/* Layout sidebar */
.rekap-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start;max-width:1100px;margin:24px auto;padding:0 16px}
.sidebar{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:16px;box-shadow:0 4px 24px rgba(0,0,0,.06);position:sticky;top:20px}
.sidebar-title{font-size:16px;font-weight:700;margin-bottom:12px}
.sidebar-toggle{float:right;width:28px;height:28px;border:1px solid var(--card-border);border-radius:7px;background:var(--btn-ghost);color:var(--btn-ghost-text);cursor:pointer;font-weight:700}
.rekap-layout.sidebar-collapsed{grid-template-columns:58px minmax(0,1fr)}
.sidebar.collapsed .sidebar-title,.sidebar.collapsed .menu-toggle,.sidebar.collapsed .exam-menu{display:none}
.sidebar.collapsed{padding:10px}
.content-box{min-width:0}
.menu-toggle{display:block;width:100%;text-align:left;padding:10px 12px;margin:4px 0;border:1px solid var(--card-border);border-radius:10px;background:var(--btn-ghost);color:var(--btn-ghost-text);font-size:14px;font-weight:600;cursor:pointer}
.menu-toggle .arrow{float:right}
.exam-menu{display:none;margin:4px 0 8px;padding:6px;background:var(--page-bg);border:1px solid var(--card-border);border-radius:10px;max-height:340px;overflow-y:auto}
.exam-menu.open{display:block}
.exam-menu a{display:block;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--text);text-decoration:none}
.exam-menu a:hover{background:var(--btn-ghost)}
.exam-menu a.active{background:var(--accent);color:#fff}
.mg{font-size:13px;margin:2px 0}
.mg-btn{display:block;width:100%;text-align:left;padding:7px 10px;border:none;border-radius:8px;background:none;color:var(--text);font-weight:700;font-size:13px;cursor:pointer}
.mg-btn:hover{background:var(--btn-ghost)}
.mg-btn .arrow{float:right;font-size:11px}
.mg-body{display:none;padding-left:8px;border-left:2px solid var(--card-border);margin-left:6px}
.mg-body.open{display:block}
.mb-btn{display:block;width:100%;text-align:left;padding:6px 8px;border:none;border-radius:7px;background:none;color:var(--text);font-size:13px;cursor:pointer}
.mb-btn:hover{background:var(--btn-ghost)}
.mb-btn .arrow{float:right;font-size:11px}
.mb-body{display:none;padding-left:8px;border-left:2px solid var(--card-border);margin-left:6px}
.mb-body.open{display:block}
.mb-body a{display:block;padding:6px 8px;border-radius:7px;font-size:12.5px;color:var(--text);text-decoration:none}
.mb-body a:hover{background:var(--btn-ghost)}
.mb-body a.active{background:var(--accent);color:#fff}
.mb-body a .cnt{float:right;font-size:11px;color:var(--muted)}
/* Modal jawaban */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--card-border);border-radius:16px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;padding:20px}
.modal h3{font-size:16px;margin-bottom:10px}
.modal .close{float:right;border:none;background:var(--btn-ghost);color:var(--btn-ghost-text);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px}
.ans-row{display:flex;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;margin:3px 0}
.ans-row.ok{background:var(--green-bg);color:var(--green)}
.ans-row.no{background:var(--red-bg);color:var(--red)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.stat-box{background:var(--page-bg);border:1px solid var(--card-border);border-radius:12px;padding:12px;text-align:center}
.stat-box .num{font-size:22px;font-weight:700}
.stat-box .lbl{font-size:12px;color:var(--sub);margin-top:2px}
.tab a{transition:background .15s ease,color .15s ease}
.fade-in{animation:gezyFade .18s ease}
@keyframes gezyFade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
</style>
<div id="app">
<div id="login-view" class="box">
<h2>🔐 Rekap Hasil CBT & Latihan</h2>
<p>Halaman khusus guru — masuk dengan akun guru untuk melihat rekap & mengunduh CSV.</p>
<label>Email</label>
<input type="text" id="g-email" placeholder="email guru" autocomplete="username">
<label>Password</label>
<input type="password" id="g-pass" placeholder="password" autocomplete="current-password">
<button onclick="doLogin()">Masuk</button>
<p class="small" id="login-msg"></p>
</div>
<div id="main-view" class="hidden">
<div class="rekap-layout">
<aside class="sidebar">
<button class="sidebar-toggle" title="Perkecil/perbesar sidebar" onclick="toggleSidebar()">‹</button>
<div class="sidebar-title">📋 Navigasi</div>
<button class="menu-toggle" onclick="toggleExamMenu()">📝 Daftar Ujian <span class="arrow" id="menu-arrow">▾</span></button>
<div id="exam-menu" class="exam-menu"></div>
<button class="menu-toggle" onclick="toggleLatMenu()">📚 Hasil Latihan <span class="arrow" id="lat-arrow">▾</span></button>
<div id="lat-menu" class="exam-menu"></div>
<a href="/cbt/progress/" style="display:block;text-decoration:none;margin-top:10px;padding:11px;border:1px solid var(--card-border);border-radius:9px;background:var(--btn-ghost);color:var(--btn-ghost-text);font-weight:700;text-align:center">● Progress Peserta</a>
</aside>
<main class="content-box">
<div class="box" style="max-width:none">
<div class="rekap-head">
<h2>📊 Rekap Hasil <span id="admin-name"></span></h2>
<button class="ghost" style="width:auto;padding:8px 16px;margin:0" onclick="doLogout()">Keluar</button>
</div>
<div class="tab">
<a data-t="ujian" href="/cbt/hasil/?view=ujian" onclick="event.preventDefault();navTo('ujian')">Per Ujian</a>
<a data-t="murid" href="/cbt/hasil/?view=murid" onclick="event.preventDefault();navTo('murid')">Per Murid</a>
<a data-t="latihan" href="/cbt/hasil/?view=latihan" onclick="event.preventDefault();navTo('latihan')">Per Latihan</a>
</div>
<div id="ujian-tab" class="hidden"></div>
<div id="murid-tab" class="hidden"></div>
<div id="latihan-tab" class="hidden"></div>
</div>
</main>
</div>
</div>
<div id="modal-root"></div>
</div>
<script>
var QUERY=new URLSearchParams(location.search),API="/api",TOK=sessionStorage.getItem("guru_tok")||"",
    DATA=[],LAT=[],TAB=QUERY.get("view")==="murid"?"murid":(QUERY.get("view")==="latihan"?"latihan":"ujian"),
    SELECTED=(QUERY.get("exam")||""),LAT_SLUG=(QUERY.get("slug")||""),EXAM_PAGE=1,EXAM_PAGE_SIZE=20;
function toggleSidebar(){
  var s=document.querySelector(".sidebar"),l=document.querySelector(".rekap-layout"),collapsed=s.classList.toggle("collapsed");
  l.classList.toggle("sidebar-collapsed",collapsed);
  document.querySelector(".sidebar-toggle").textContent=collapsed?"›":"‹";
  try{localStorage.setItem("gezyclass-sidebar-collapsed",collapsed?"1":"0")}catch(e){}
}
try{if(localStorage.getItem("gezyclass-sidebar-collapsed")==="1")toggleSidebar()}catch(e){}
function hdr(){return {"Authorization":TOK}}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fmtDate(s){if(!s)return "-";try{var d=new Date(s);return d.toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return s}}
function grade(pct){return pct>=90?"A":pct>=80?"B":pct>=70?"C":pct>=60?"D":"E"}
function pctOf(t,m){return m>0?Math.round(t/m*100):0}

async function doLogin(){
var em=document.getElementById("g-email").value.trim(),ps=document.getElementById("g-pass").value;
document.getElementById("login-msg").textContent="⏳ Memeriksa...";
try{
  var r=await fetch(API+"/collections/guru/auth-with-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({identity:em,password:ps})});
  var d=await r.json();
  if(d.token){TOK=d.token;sessionStorage.setItem("guru_tok",TOK);document.getElementById("admin-name").textContent="· "+em;await loadData();}
  else{document.getElementById("login-msg").textContent="❌ Login gagal: email/password salah.";}
}catch(e){document.getElementById("login-msg").textContent="❌ Gagal terhubung: "+e.message}
}
function doLogout(){TOK="";sessionStorage.removeItem("guru_tok");location.reload()}

async function loadData(){
document.getElementById("login-view").style.display="none";
document.getElementById("main-view").classList.remove("hidden");
var el=document.getElementById(TAB==="latihan"?"latihan-tab":(TAB==="murid"?"murid-tab":"ujian-tab"));
el.innerHTML='<div class="loading">⏳ Memuat data...</div>';
try{
  var [r1,r2]=await Promise.all([
    fetch(API+"/guru/exam-recap",{headers:hdr()}),
    fetch(API+"/guru/latihan",{headers:hdr()})
  ]);
  var d1=await r1.json(),d2=await r2.json();
  if(d1.message&&!d1.items){el.innerHTML='<p style="text-align:center;color:var(--red)">'+esc(d1.message)+'</p>';return;}
  DATA=d1.items||[];LAT=(d2.items||[]).filter(function(x){return x.sesi&&x.sesi.length>0});
  renderExamMenu();
  renderLatMenu();
  renderUjian();
  renderMurid();
  renderLatihan();
  showTab(TAB);
}catch(e){el.innerHTML='<p style="text-align:center;color:var(--red)">Gagal: '+esc(e.message)+'</p>'}
}

function toggleExamMenu(){var m=document.getElementById("exam-menu"),open=m.classList.toggle("open");document.getElementById("menu-arrow").textContent=open?"▴":"▾"}
function toggleLatMenu(){var m=document.getElementById("lat-menu"),open=m.classList.toggle("open");document.getElementById("lat-arrow").textContent=open?"▴":"▾";if(open&&!document.getElementById("lat-menu").dataset.built)renderLatMenu()}

function renderExamMenu(){
  var m=document.getElementById("exam-menu");
  if(!DATA.length){m.innerHTML='<div class="small">Belum ada ujian.</div>';return;}
  m.innerHTML=DATA.map(function(ex){return "<a href='/cbt/hasil/?view=ujian&exam="+encodeURIComponent(ex.exam_id)+"' data-exam='"+esc(ex.exam_id)+"' class='"+(SELECTED===ex.exam_id?"active":"")+"' onclick='event.preventDefault();navTo(\"ujian\",this.dataset.exam)'>"+esc(ex.title)+"</a>"}).join("");
  m.classList.add("open");
}

function renderLatMenu(){
  var m=document.getElementById("lat-menu");
  m.dataset.built="1";
  if(!LAT.length){m.innerHTML='<div class="small">Belum ada hasil latihan.</div>';return;}
  // kelompokkan: kelas -> bab -> subbab
  var kelasMap={};
  LAT.forEach(function(it){
    if(!kelasMap[it.kelas])kelasMap[it.kelas]={};
    if(!kelasMap[it.kelas][it.bab])kelasMap[it.kelas][it.bab]=[];
    kelasMap[it.kelas][it.bab].push(it);
  });
  var html="";
  Object.keys(kelasMap).sort().forEach(function(k){
    var babs=kelasMap[k],htmlBab="";
    Object.keys(babs).forEach(function(b){
      var subs=babs[b];
      var htmlSub=subs.map(function(it){
        return "<a href='/cbt/hasil/?view=latihan&slug="+encodeURIComponent(it.slug)+"' data-slug='"+esc(it.slug)+"' class='"+(LAT_SLUG===it.slug?"active":"")+"' onclick='event.preventDefault();navTo(\"latihan\",null,this.dataset.slug)'>"+esc(it.judul.replace(/^Latihan:\s*/,""))+" <span class='cnt'>"+it.sesi.length+"</span></a>";
      }).join("");
      htmlBab+="<button class='mb-btn' onclick='tg(this)'>"+esc(b)+" ("+subs.length+") <span class='arrow'>▾</span></button><div class='mb-body'>"+htmlSub+"</div>";
    });
    html+="<button class='mg-btn' onclick='tg(this)'>Kelas "+esc(k)+" <span class='arrow'>▾</span></button><div class='mg-body'>"+htmlBab+"</div>";
  });
  m.innerHTML=html;
  m.classList.add("open");
  // buka otomatis cabang yang berisi LAT_SLUG aktif
  if(LAT_SLUG){
    var act=m.querySelector("a.active");
    if(act){var mb=act.closest(".mb-body"),mg=act.closest(".mg-body");if(mb)mb.classList.add("open");if(mg)mg.classList.add("open");}
  }
}
function tg(btn){var b=btn.nextElementSibling;b.classList.toggle("open");btn.querySelector(".arrow").textContent=b.classList.contains("open")?"▴":"▾"}

function showTab(t){
  TAB=t;
  document.querySelectorAll(".tab a").forEach(function(a){a.classList.toggle("active",a.dataset.t===t)});
  document.getElementById("ujian-tab").classList.toggle("hidden",t!=="ujian");
  document.getElementById("murid-tab").classList.toggle("hidden",t!=="murid");
  document.getElementById("latihan-tab").classList.toggle("hidden",t!=="latihan");
}
function selectExam(id){navTo("ujian",id)}
function examPage(page){
  EXAM_PAGE=Math.max(1,Number(page)||1);
  renderUjian();
  window.scrollTo({top:document.getElementById("ujian-tab").offsetTop-20,behavior:"smooth"});
}
function syncActive(){
  document.querySelectorAll("#exam-menu a[data-exam]").forEach(function(a){a.classList.toggle("active",a.getAttribute("data-exam")===SELECTED)});
  document.querySelectorAll("#lat-menu a[data-slug]").forEach(function(a){a.classList.toggle("active",a.getAttribute("data-slug")===LAT_SLUG)});
}
function fadeTab(el){if(!el)return;el.classList.remove("fade-in");void el.offsetWidth;el.classList.add("fade-in")}
function renderCurrent(){
  if(TAB==="ujian"){renderUjian();fadeTab(document.getElementById("ujian-tab"))}
  else if(TAB==="latihan"){renderLatihan();fadeTab(document.getElementById("latihan-tab"))}
  else {renderMurid();fadeTab(document.getElementById("murid-tab"))}
}
function navTo(view,exam,slug){
  if(exam!==undefined&&exam!==null){SELECTED=String(exam);EXAM_PAGE=1;}
  if(slug!==undefined&&slug!==null)LAT_SLUG=String(slug);
  TAB=view==="murid"?"murid":(view==="latihan"?"latihan":"ujian");
  var qs="view="+TAB;
  if(SELECTED)qs+="&exam="+encodeURIComponent(SELECTED);
  if(LAT_SLUG)qs+="&slug="+encodeURIComponent(LAT_SLUG);
  try{history.pushState({view:TAB,exam:SELECTED,slug:LAT_SLUG},"","/cbt/hasil/?"+qs)}catch(e){}
  showTab(TAB);
  syncActive();
  renderCurrent();
  window.scrollTo({top:0,behavior:"smooth"});
}
window.addEventListener("popstate",function(e){
  var st=e.state||{};
  SELECTED=st.exam||"";LAT_SLUG=st.slug||"";
  TAB=(st.view==="murid"?"murid":(st.view==="latihan"?"latihan":"ujian"))||"ujian";
  showTab(TAB);syncActive();renderCurrent();
});

function renderUjian(){
  var el=document.getElementById("ujian-tab");
  if(!SELECTED){el.innerHTML='<div class="loading">Pilih nama ujian pada menu “Daftar Ujian” untuk melihat hasilnya.</div>';return;}
  var html="";
  DATA.filter(function(ex){return ex.exam_id===SELECTED}).forEach(function(ex){
    var done=ex.sesi.filter(function(s){return s.status==="submitted"});
    var ongoing=ex.sesi.filter(function(s){return s.status==="ongoing"});
    html+="<div class='exam-card'><h3>"+esc(ex.title)+" <span class='badge'>"+esc(ex.class_name||"-")+"</span></h3>";
    html+="<div class='meta'>⏱ "+Math.round((ex.duration||0)/60)+" menit · peserta: "+ex.sesi.length+" (selesai "+done.length+", berjalan "+ongoing.length+")</div>";
    html+="<div class='btn-line'><button class='btn-csv' onclick='downloadCsv(\""+ex.exam_id+"\")'>⬇ Unduh CSV</button><button class='btn-print' onclick='printExam(\""+ex.exam_id+"\")'>🖨 Cetak</button></div>";
    var isSurvey=!!ex.survey;
    var headCols=isSurvey?"<th>Status</th><th>Profil</th><th>A</th><th>B</th>":"<th>Status</th><th>Nilai</th><th>%</th>";
    html+="<div class='wrap-table'><table><thead><tr><th>No</th><th>Nama</th><th>Absen</th><th>Kelas</th><th>Sekolah</th>"+headCols+"<th>Mulai</th><th>Selesai</th><th>Detail</th></tr></thead><tbody>";
    var rows=ex.sesi.slice().sort(function(a,b){return (a.status==="submitted"?0:1)-(b.status==="submitted"?0:1)||(b.profile||"").localeCompare(a.profile||"")});
    var totalRows=rows.length,totalPages=Math.max(1,Math.ceil(totalRows/EXAM_PAGE_SIZE));
    EXAM_PAGE=Math.min(EXAM_PAGE,totalPages);
    var pageRows=rows.slice((EXAM_PAGE-1)*EXAM_PAGE_SIZE,EXAM_PAGE*EXAM_PAGE_SIZE);
    pageRows.forEach(function(s,i){
      var rowNumber=(EXAM_PAGE-1)*EXAM_PAGE_SIZE+i+1;
      var pct=pctOf(s.total_score,s.max_score);
      var st=s.status==="submitted"?"<span class='chip submitted'>Selesai</span>":"<span class='chip ongoing'>Berjalan</span>";
      var valCols,midCols;
      if(isSurvey){
        var profLabel=s.profile==="PPT"?"Pola Pikir Tetap":(s.profile==="PPB"?"Pola Pikir Bertumbuh":(s.profile==="Campuran"?"Campuran":"-"));
        midCols="<td>"+st+"</td><td>"+(s.status==="submitted"?esc(profLabel):"-")+"</td><td>"+(s.profile_a!=null?s.profile_a:"-")+"</td><td>"+(s.profile_b!=null?s.profile_b:"-")+"</td>";
        valCols="";
      }else{
        valCols="<td>"+(s.status==="submitted"?(s.total_score+" / "+s.max_score+" ("+pct+"%)"):"-")+"</td><td>"+(s.status==="submitted"?(pct+"% "+(grade(pct))):"-")+"</td>";
        midCols="<td>"+st+"</td>";
      }
      html+="<tr><td>"+rowNumber+"</td><td>"+esc(s.nama)+"</td><td>"+esc(s.no_absen)+"</td><td>"+esc(s.kelas)+"</td><td>"+esc(s.sekolah||"")+"</td>"+midCols+valCols+"<td>"+fmtDate(s.started_at)+"</td><td>"+fmtDate(s.ended_at)+"</td><td><a class='link-pill' target='_blank' href='/cbt/ujian/?session="+s.id+"&review=1'>buka</a></td></tr>";
    });
    if(totalPages>1){
      html+="</tbody></table></div><div class='pagination-info'>Menampilkan "+(((EXAM_PAGE-1)*EXAM_PAGE_SIZE)+1)+"–"+Math.min(EXAM_PAGE*EXAM_PAGE_SIZE,totalRows)+" dari "+totalRows+" baris</div><div class='pagination'>";
      html+="<button onclick='examPage("+(EXAM_PAGE-1)+")' "+(EXAM_PAGE===1?"disabled":"")+">‹</button>";
      var visiblePages=[];
      if(totalPages<=7){
        for(var pg=1;pg<=totalPages;pg++)visiblePages.push(pg);
      }else{
        var pageStart=Math.max(2,EXAM_PAGE-2),pageEnd=Math.min(totalPages-1,EXAM_PAGE+2);
        if(EXAM_PAGE<=4)pageEnd=5;
        if(EXAM_PAGE>=totalPages-3)pageStart=totalPages-4;
        visiblePages.push(1);
        if(pageStart>2)visiblePages.push("ellipsis");
        for(var pg2=pageStart;pg2<=pageEnd;pg2++)visiblePages.push(pg2);
        if(pageEnd<totalPages-1)visiblePages.push("ellipsis");
        visiblePages.push(totalPages);
      }
      visiblePages.forEach(function(pg){
        if(pg==="ellipsis")html+="<span class='ellipsis' aria-hidden='true'>…</span>";
        else html+="<button class='"+(pg===EXAM_PAGE?"active":"")+"' "+(pg===EXAM_PAGE?"aria-current='page' ":"")+"onclick='examPage("+pg+")'>"+pg+"</button>";
      });
      html+="<button onclick='examPage("+(EXAM_PAGE+1)+")' "+(EXAM_PAGE===totalPages?"disabled":"")+">›</button></div></div>";
    }else html+="</tbody></table></div></div>";
  });
  el.innerHTML=html;
}

function renderMurid(){
  var map={};
  DATA.forEach(function(ex){
    ex.sesi.forEach(function(s){
      if(s.status!=="submitted")return;
      var key=(s.nama||"-")+"|"+(s.kelas||"");
      if(!map[key])map[key]={nama:s.nama,kelas:s.kelas,rows:[]};
      map[key].rows.push({title:ex.title,score:s.total_score,max:s.max_score,ended:s.ended_at});
    });
  });
  var list=Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return (a.kelas||"").localeCompare(b.kelas||"")||(a.nama||"").localeCompare(b.nama||"")});
  var html="<div class='wrap-table'><table><thead><tr><th>Nama</th><th>Kelas</th><th>Ujian</th><th>Nilai</th><th>%</th><th>Waktu</th></tr></thead><tbody>";
  list.forEach(function(m){
    var rows=m.rows.map(function(r){return "<tr><td>"+esc(m.nama)+"</td><td>"+esc(m.kelas)+"</td><td>"+esc(r.title)+"</td><td>"+r.score+" / "+r.max+"</td><td>"+pctOf(r.score,r.max)+"% ("+grade(pctOf(r.score,r.max))+")</td><td>"+fmtDate(r.ended)+"</td></tr>"}).join("");
    html+=rows;
  });
  html+="</tbody></table></div>";
  document.getElementById("murid-tab").innerHTML=html;
}

function renderLatihan(){
  var el=document.getElementById("latihan-tab");
  if(!LAT_SLUG){
    el.innerHTML='<div class="loading">Pilih subbab latihan pada menu “Hasil Latihan” di sidebar untuk melihat hasilnya.</div>';
    return;
  }
  var it=LAT.filter(function(x){return x.slug===LAT_SLUG})[0];
  if(!it){el.innerHTML='<p style="text-align:center;color:var(--red)">Latihan tidak ditemukan.</p>';return;}
  var sesi=(it.sesi||[]).filter(function(s){return s.status==="submitted"});
  var total=sesi.length;
  var avg=total?Math.round(sesi.reduce(function(a,s){return a+s.total_score},0)/total):0;
  var max=it.sesi.length&&it.sesi[0].max_score?it.sesi[0].max_score:10;
  var html="<div class='exam-card'><h3>"+esc(it.judul)+" <span class='badge'>Kelas "+esc(it.kelas)+"</span></h3>";
  html+="<div class='meta'>📖 "+esc(it.bab)+" · selesai "+total+" dari "+it.sesi.length+" sesi</div>";
  html+="<div class='stat-grid'><div class='stat-box'><div class='num'>"+total+"</div><div class='lbl'>Selesai</div></div><div class='stat-box'><div class='num'>"+avg+"</div><div class='lbl'>Rata-rata / "+max+"</div></div><div class='stat-box'><div class='num'>"+(it.sesi.length-total)+"</div><div class='lbl'>Belum selesai</div></div></div>";
  html+="<div class='btn-line'><button class='btn-csv' onclick='downloadLatCsv(\""+esc(it.slug)+"\")'>⬇ Unduh CSV</button><button class='btn-print' onclick='printLat(\""+esc(it.slug)+"\")'>🖨 Cetak</button></div>";
  html+="<div class='wrap-table'><table><thead><tr><th>No</th><th>Nama</th><th>Absen</th><th>Kelas</th><th>Ke-</th><th>Nilai</th><th>%</th><th>Selesai</th><th>Jawaban</th></tr></thead><tbody>";
  sesi.slice().sort(function(a,b){return b.total_score-a.total_score}).forEach(function(s,i){
    var pct=pctOf(s.total_score,s.max_score);
    html+="<tr><td>"+(i+1)+"</td><td>"+esc(s.nama)+"</td><td>"+esc(s.no_absen)+"</td><td>"+esc(s.kelas)+"</td><td>"+(s.attempt||1)+"</td><td>"+s.total_score+" / "+s.max_score+" ("+pct+"%)</td><td>"+pct+"% "+(grade(pct))+"</td><td>"+fmtDate(s.ended_at)+"</td><td><button class='link-pill' onclick='showAns(\""+esc(s.id)+"\")'>lihat</button></td></tr>";
  });
  html+="</tbody></table></div></div>";
  el.innerHTML=html;
}

function showAns(sid){
  var it=LAT.filter(function(x){return x.slug===LAT_SLUG})[0];
  if(!it)return;
  var s=it.sesi.filter(function(x){return x.id===sid})[0];
  if(!s||!s.jawaban_json||!s.jawaban_json.length){alert("Tidak ada detail jawaban.");return;}
  var rows=s.jawaban_json.map(function(j){
    var cls=j.ok?"ok":"no",label=j.ok?"Benar":"Salah";
    return "<div class='ans-row "+cls+"'><span>No. "+(j.i+1)+"</span><span>Jawaban: "+esc(j.st)+"</span><span>"+label+"</span></div>";
  }).join("");
  document.getElementById("modal-root").innerHTML="<div class='modal-overlay' onclick='closeModal(event)'><div class='modal'><button class='close' onclick='closeModal()'>✕</button><h3>"+esc(s.nama)+" — "+s.total_score+"/"+s.max_score+"</h3>"+rows+"</div></div>";
}
function closeModal(e){if(e&&e.target&&!e.target.classList.contains("modal-overlay"))return;document.getElementById("modal-root").innerHTML=""}

function csvEscape(v){var s=String(v==null?"":v);if(/[",;\n]/.test(s))return '"'+s.replace(/"/g,'""')+'"';return s}
function downloadCsv(examId){
var ex=DATA.filter(function(e){return e.exam_id===examId})[0];
if(!ex)return;
var isSurvey=!!ex.survey;
var lines=isSurvey?["Nama,No Absen,Kelas,Sekolah,Status,Profil,A,B,Mulai,Selesai"]:["Nama,No Absen,Kelas,Sekolah,Status,Nilai,Max,Persen,Grade,Mulai,Selesai"];
ex.sesi.forEach(function(s){
  var pct=pctOf(s.total_score,s.max_score);
  if(isSurvey){
    var profLabel=s.profile==="PPT"?"Pola Pikir Tetap":(s.profile==="PPB"?"Pola Pikir Bertumbuh":(s.profile==="Campuran"?"Campuran":"-"));
    lines.push([s.nama,s.no_absen,s.kelas,s.sekolah||"",s.status==="submitted"?"Selesai":"Berjalan",s.status==="submitted"?profLabel:"",s.profile_a!=null?s.profile_a:"",s.profile_b!=null?s.profile_b:"",s.started_at,s.ended_at].map(csvEscape).join(","));
  }else{
    lines.push([s.nama,s.no_absen,s.kelas,s.sekolah||"",s.status==="submitted"?"Selesai":"Berjalan",s.status==="submitted"?s.total_score:"",s.max_score,s.status==="submitted"?pct+"%":"",s.status==="submitted"?grade(pct):"",s.started_at,s.ended_at].map(csvEscape).join(","));
  }
});
var blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="rekap-"+ex.title.replace(/[^\w\- ]+/g,"").replace(/\s+/g,"-")+".csv";a.click();
}
function downloadLatCsv(slug){
var it=LAT.filter(function(x){return x.slug===slug})[0];
if(!it)return;
var lines=["Nama,No Absen,Kelas,Percobaan,Nilai,Max,Persen,Grade,Selesai"];
(it.sesi||[]).forEach(function(s){
  if(s.status!=="submitted")return;
  var pct=pctOf(s.total_score,s.max_score);
  lines.push([s.nama,s.no_absen,s.kelas,s.attempt||1,s.total_score,s.max_score,pct+"%",grade(pct),s.ended_at].map(csvEscape).join(","));
});
var blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="rekap-latihan-"+it.judul.replace(/[^\w\- ]+/g,"").replace(/\s+/g,"-")+".csv";a.click();
}
function printLat(slug){
var it=LAT.filter(function(x){return x.slug===slug})[0];
if(!it)return;
var w=window.open("","_blank");
var rows=(it.sesi||[]).filter(function(s){return s.status==="submitted"}).map(function(s,i){return "<tr><td>"+(i+1)+"</td><td>"+esc(s.nama)+"</td><td>"+esc(s.kelas)+"</td><td>"+s.total_score+" / "+s.max_score+" ("+pctOf(s.total_score,s.max_score)+"%)</td></tr>"}).join("");
w.document.write("<html><head><title>"+esc(it.judul)+"</title><style>table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--row-border);padding:6px 10px;font-size:13px}th{background:var(--thead-bg)}</style></head><body><h2>"+esc(it.judul)+" — Kelas "+esc(it.kelas)+"</h2><table><thead><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Nilai</th></tr></thead><tbody>"+rows+"</tbody></table><p style='font-size:12px;color:var(--muted)'>Dicetak "+new Date().toLocaleString("id-ID")+"</p></body></html>");
w.document.close();w.print();
}
function printExam(examId){
var ex=DATA.filter(function(e){return e.exam_id===examId})[0];
if(!ex)return;
var w=window.open("","_blank");
var isSurvey=!!ex.survey;
var isLikert=ex.survey_type==="likert";
var printHead=isSurvey?(isLikert?"<th>No</th><th>Nama</th><th>Kelas</th><th>Kategori</th><th>Skor</th>":"<th>No</th><th>Nama</th><th>Kelas</th><th>Profil</th><th>A</th><th>B</th>"):"<th>No</th><th>Nama</th><th>Kelas</th><th>Nilai</th>";
var rows=ex.sesi.filter(function(s){return s.status==="submitted"}).map(function(s,i){
  if(isSurvey){
    if(isLikert){
      return "<tr><td>"+(i+1)+"</td><td>"+esc(s.nama)+"</td><td>"+esc(s.kelas)+"</td><td>"+esc(s.profile||"")+"</td><td>"+(s.profile_a!=null?s.profile_a:"")+"</td></tr>";
    }
    var profLabel=s.profile==="PPT"?"Pola Pikir Tetap":(s.profile==="PPB"?"Pola Pikir Bertumbuh":(s.profile==="Campuran"?"Campuran":"-"));
    return "<tr><td>"+(i+1)+"</td><td>"+esc(s.nama)+"</td><td>"+esc(s.kelas)+"</td><td>"+esc(profLabel)+"</td><td>"+(s.profile_a!=null?s.profile_a:"")+"</td><td>"+(s.profile_b!=null?s.profile_b:"")+"</td></tr>";
  }
  return "<tr><td>"+(i+1)+"</td><td>"+esc(s.nama)+"</td><td>"+esc(s.kelas)+"</td><td>"+s.total_score+" / "+s.max_score+" ("+pctOf(s.total_score,s.max_score)+"%)</td></tr>";
}).join("");
w.document.write("<html><head><title>"+esc(ex.title)+"</title><style>table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--row-border);padding:6px 10px;font-size:13px}th{background:var(--thead-bg)}</style></head><body><h2>"+esc(ex.title)+" — "+esc(ex.class_name)+"</h2><table><thead><tr>"+printHead+"</tr></thead><tbody>"+rows+"</tbody></table><p style='font-size:12px;color:var(--muted)'>Dicetak "+new Date().toLocaleString("id-ID")+"</p></body></html>");
w.document.close();w.print();
}

if(TOK){document.getElementById("login-view").style.display="none";document.getElementById("main-view").classList.remove("hidden");loadData();}
