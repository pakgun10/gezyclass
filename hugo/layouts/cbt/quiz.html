{{ define "main" }}
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--page-bg);color:var(--text);min-height:100vh}
.q-header{background:var(--nav-bg);color:var(--nav-text);padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
.q-header .timer{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.q-header .progress{font-size:14px;opacity:.8}
.q-container{max-width:700px;margin:0 auto;padding:16px}
.q-card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.q-text{font-size:17px;line-height:1.7;margin-bottom:20px}
.q-option{display:block;width:100%;padding:14px 16px;margin:8px 0;border:2px solid var(--card-border);border-radius:10px;background:var(--card);color:var(--text);font-size:16px;text-align:left;cursor:pointer;transition:all .15s}
.q-option:hover{border-color:var(--accent)}
.q-option.selected{border-color:var(--accent);background:var(--sel-bg)}
.q-option .q-opt-mark{display:inline-block;width:34px;text-align:center;font-weight:700;color:var(--muted);font-size:15px}
.q-option.selected .q-opt-mark{color:var(--accent)}
.q-nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.q-nav button{width:40px;height:40px;border-radius:8px;border:1px solid var(--card-border);background:var(--card);color:var(--text);font-size:14px;cursor:pointer}
.q-nav button.current{border:2px solid var(--accent);font-weight:700}
.q-nav button.answered{background:var(--green-bg);border-color:var(--green-border)}
.q-actions{display:flex;gap:12px;margin-top:20px}
.q-actions button{flex:1;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.btn-prev{background:var(--btn-ghost);color:var(--btn-ghost-text)}
.btn-next{background:var(--accent);color:#fff}
.btn-submit{background:var(--danger);color:#fff}
.loading{text-align:center;padding:60px 20px;color:var(--sub);font-size:18px}
.q-type-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--btn-ghost);color:var(--muted);margin-bottom:10px;letter-spacing:.02em}
.result-hero{background:linear-gradient(135deg,#111827,#1f3a5f);color:#fff;border-radius:20px;padding:32px 28px;text-align:center;margin-bottom:24px}
.result-hero h2{font-size:28px;margin-bottom:8px}
.result-score{font-size:48px;font-weight:800;margin:16px 0}
.result-score .max{font-size:24px;opacity:.7}
.result-meta{display:flex;justify-content:center;gap:24px;margin-top:12px;font-size:14px;opacity:.85;flex-wrap:wrap}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.result-stat{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:16px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.result-stat .num{font-size:28px;font-weight:700}
.result-stat .lbl{font-size:13px;color:var(--sub);margin-top:4px}
.result-stat.correct .num{color:var(--green)}
.result-stat.wrong .num{color:var(--red)}
.result-stat.empty .num{color:var(--num-empty)}
.review-card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:20px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.review-card.correct{border-left:4px solid var(--green-border)}
.review-card.wrong{border-left:4px solid var(--red-border)}
.review-card.empty{border-left:4px solid var(--num-empty)}
.review-q{font-size:16px;font-weight:600;margin-bottom:12px}
.review-q .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}
.review-q .badge.correct{background:var(--green-bg);color:var(--green)}
.review-q .badge.wrong{background:var(--red-bg);color:var(--red)}
.review-q .badge.empty{background:var(--btn-ghost);color:var(--num-empty)}
.review-opt{padding:10px 14px;margin:6px 0;border-radius:8px;font-size:15px;display:flex;align-items:center;gap:8px}
.review-opt.student-correct{background:var(--green-bg);border:1px solid var(--green-border)}
.review-opt.student-wrong{background:var(--red-bg);border:1px solid var(--red-border)}
.review-opt.correct-answer{background:var(--green-bg);border:1px solid var(--green-border)}
.review-opt .icon{font-size:18px}
.review-explanation{background:var(--expl-bg);border-radius:8px;padding:12px 16px;margin-top:12px;font-size:14px;color:var(--expl-text);line-height:1.6}
.review-explanation strong{color:var(--expl-text)}
.result-actions{display:flex;gap:12px;justify-content:center;margin-top:24px}
.result-actions a{padding:12px 24px;border-radius:10px;text-decoration:none;font-weight:600;font-size:15px}
.result-actions a.primary{background:var(--accent);color:#fff}
</style>
<div id="app">
<div class="loading" id="loading">⏳ Memuat soal ujian...</div>
<div id="quiz" style="display:none"></div>
<div id="finished" style="display:none"></div>
</div>
<script>
var API="/api",sessionId=new URLSearchParams(location.search).get("session"),
    state={questions:[],current:0,answers:{},timer:0,interval:null,examTitle:"",sessionData:{}};

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}}

async function init(){
if(!sessionId){document.getElementById("loading").innerHTML="Session tidak ditemukan.";return}
try{
  var sr=await(await fetch(API+"/exam/session?id="+sessionId)).json();
  state.sessionData=sr;
  if(sr.status==="submitted"){
    document.getElementById("loading").style.display="none";
    await loadAndShowResults();
    return;
  }
  if(sr.status!=="ongoing"){document.getElementById("loading").innerHTML="Ujian sudah selesai.";return}
  state.timer=sr.duration||1800;
  state.examTitle=sr.exam_title||"Ujian";
  var eqs=await(await fetch(API+"/pub/exam-questions?exam_id="+sr.exam_id)).json();
  state.questions=(eqs.items||[]).map(function(eq){
    var opts=(eq.options||[]).map(function(o){return {text:o.text,oid:o.oid};});
    shuffle(opts);
    return {eqId:eq.eqId,qid:eq.qid,question:eq.question,options:opts,points:eq.points||5,type:eq.type||"pg"};
  });
  shuffle(state.questions);
  startTimer();
  render();
}catch(e){document.getElementById("loading").innerHTML="Gagal: "+e.message}
}

function startTimer(){state.interval=setInterval(function(){state.timer--;var el=document.getElementById("timer");if(el)el.textContent=fmt(state.timer);if(state.timer<=0)submit()},1000)}
function fmt(s){var m=Math.floor(s/60),sec=s%60;return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0")}

// Autosave jawaban ke server tiap 15 detik + saat menutup tab
function autosave(){
  if(!sessionId||(state.sessionData&&state.sessionData.status!=="ongoing"))return;
  var keys=Object.keys(state.answers);
  if(!keys.length)return;
  fetch(API+"/exam/autosave",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sessionId,answers:state.answers})}).catch(function(){});
}
setInterval(autosave,15000);
window.addEventListener("beforeunload",function(){
  if(sessionId&&Object.keys(state.answers).length){
    var payload=JSON.stringify({session_id:sessionId,answers:state.answers});
    if(navigator.sendBeacon){navigator.sendBeacon(API+"/exam/autosave",new Blob([payload],{type:"application/json"}));}
    else{fetch(API+"/exam/autosave",{method:"POST",headers:{"Content-Type":"application/json"},body:payload,keepalive:true}).catch(function(){});}
  }
});

function typeLabel(t){return (t==="pgk"||t==="mr")?"Pilihan Ganda Kompleks":(t==="bs"?"Benar / Salah":"Pilihan Ganda")}

function render(){
document.getElementById("loading").style.display="none";
document.getElementById("quiz").style.display="block";
var q=state.questions[state.current],optsHtml="",letters=["A","B","C","D","E","F"];
if(q.options&&q.options.length){
  (q.options).forEach(function(o,i){
    var sel=false;
    if(q.type==="pgk"||q.type==="mr"){sel=(state.answers[q.eqId]||[]).indexOf(o.oid)>=0;}
    else{sel=state.answers[q.eqId]===o.oid;}
    var cls=sel?"selected":"";
    var mark=sel?((q.type==="pgk"||q.type==="mr")?"☑ ":"● "):((q.type==="pgk"||q.type==="mr")?"☐ ":"○ ");
    optsHtml+="<button class='q-option "+cls+"' onclick=\"answer('"+q.eqId+"',"+o.oid+",'"+q.type+"')\"><span class='q-opt-mark'>"+mark+letters[i]+".</span> "+o.text+"</button>";
  });
}
var navHtml="";state.questions.forEach(function(_,i){var cls=i===state.current?"current":"";if(state.answers[state.questions[i].eqId]!==undefined)cls+=" answered";navHtml+="<button class='"+cls+"' onclick='goTo("+i+")'>"+(i+1)+"</button>"});
var prevBtn=state.current>0?"<button class='btn-prev' onclick='goTo("+(state.current-1)+")'>Sebelumnya</button>":"";
var nextBtn=state.current<state.questions.length-1?"<button class='btn-next' onclick='goTo("+(state.current+1)+")'>Selanjutnya</button>":"<button class='btn-submit' onclick='submit()'>Selesai Ujian</button>";
document.getElementById("quiz").innerHTML="<div class='q-header'><span>📐 "+state.examTitle+"</span><span class='timer' id='timer'>"+fmt(state.timer)+"</span><span class='progress'>"+(state.current+1)+"/"+state.questions.length+"</span></div><div class='q-container'><div class='q-card'><span class='q-type-badge'>"+typeLabel(q.type)+"</span><div class='q-text'>"+(state.current+1)+". "+q.question+"</div><div id='opts'>"+optsHtml+"</div>"+((q.type==="pgk"||q.type==="mr")?"<p style='font-size:13px;color:var(--muted);margin-top:8px'>Pilih lebih dari satu jawaban yang benar.</p>":"")+"</div><div class='q-nav'>"+navHtml+"</div><div class='q-actions'>"+prevBtn+nextBtn+"</div></div>";
renderMath();
}
function renderMath(){if(typeof renderMathInElement==="function"){renderMathInElement(document.getElementById("quiz"),{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false},{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}]})}}

function answer(eqId,oid,type){
  if(type==="pgk"||type==="mr"){
    var arr=(state.answers[eqId]||[]).slice();
    var p=arr.indexOf(oid);
    if(p>=0)arr.splice(p,1);else arr.push(oid);
    state.answers[eqId]=arr;
  }else{
    state.answers[eqId]=oid;
  }
  render();
}
function goTo(i){state.current=i;render()}

async function submit(){
clearInterval(state.interval);
try{
  var r=await fetch(API+"/exam/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sessionId,answers:state.answers})});
  var d=await r.json();
  if(d.message&&d.total_score===undefined){alert(d.message);return}
  state.sessionData.status="submitted";
  await showFinished(d);
}catch(e){alert("Gagal mengumpulkan: "+e.message)}
}

function buildReview(d){
  if(!d.show_explanation)return "";
  var html="<h3 style='margin:24px 0 12px;font-size:18px'>Review Jawaban</h3>";
  (d.review||[]).forEach(function(q,i){
    var sel=q.selected_index;
    var selSet=Array.isArray(sel)?(sel||[]):(sel===null||sel===undefined?[]:[sel]);
    var corrSet=Array.isArray(q.correct_index)?(q.correct_index||[]):(q.correct_index===null||q.correct_index===undefined?[]:[q.correct_index]);
    var has=selSet.length>0;
    var cls=!has?"empty":(q.is_correct?"correct":"wrong");
    var badgeTxt=!has?"Tidak Dijawab":(q.is_correct?"Benar":"Salah");
    var optsHtml="",letters=["A","B","C","D","E","F"];
    (q.options||[]).forEach(function(o,j){
      var stu=selSet.indexOf(o.oid)>=0,cor=corrSet.indexOf(o.oid)>=0;
      var oc="",icon="";
      if(stu&&cor){oc="student-correct";icon="✅"}
      else if(stu&&!cor){oc="student-wrong";icon="❌"}
      else if(cor){oc="correct-answer";icon="✓"}
      optsHtml+="<div class='review-opt "+oc+"'><span class='icon'>"+icon+"</span><b>"+letters[j]+".</b>&nbsp;"+o.text+"</div>";
    });
    var expl="";
    if(d.show_explanation&&q.explanation)expl="<div class='review-explanation'><strong>💡 Penjelasan:</strong> "+q.explanation+"</div>";
    html+="<div class='review-card "+cls+"'><div class='review-q'>"+(i+1)+". "+q.question+" <span class='badge "+cls+"'>"+badgeTxt+"</span></div>"+optsHtml+expl+"</div>";
  });
  return html;
}

async function showFinished(d){
document.getElementById("quiz").style.display="none";
document.getElementById("finished").style.display="block";
var pct=d.max_score>0?Math.round(d.total_score/d.max_score*100):0;
var grade=pct>=90?"A":pct>=80?"B":pct>=70?"C":pct>=60?"D":"E";
var scoreHtml="";
if(d.show_score){
  scoreHtml="<div class='result-hero'><h2>✅ Ujian Selesai!</h2><div class='result-score'>"+d.total_score+"<span class='max'> / "+d.max_score+"</span></div><div style='font-size:18px;opacity:.9'>Nilai: "+pct+" ("+grade+")</div><div class='result-meta'><span>📝 "+d.exam_title+"</span><span>👤 "+(d.nama||"")+"</span></div></div><div class='result-stats'><div class='result-stat correct'><div class='num'>"+d.correct+"</div><div class='lbl'>Benar</div></div><div class='result-stat wrong'><div class='num'>"+d.wrong+"</div><div class='lbl'>Salah</div></div><div class='result-stat empty'><div class='num'>"+d.empty+"</div><div class='lbl'>Kosong</div></div></div>";
}else{
  scoreHtml="<div class='result-hero'><h2>✅ Ujian Selesai!</h2><p>Jawaban kamu sudah tersimpan.</p><div class='result-meta'><span>📝 "+d.exam_title+"</span><span>👤 "+(d.nama||"")+"</span></div></div>";
}
var actionsHtml="<div class='result-actions'><a href='/cbt/' class='primary'>Kembali ke CBT</a></div>";
document.getElementById("finished").innerHTML="<div class='q-container'>"+scoreHtml+buildReview(d)+actionsHtml+"</div>";
}

async function loadAndShowResults(){
try{
  var d=await(await fetch(API+"/exam/review?session="+sessionId)).json();
  if(d.message&&d.total_score===undefined&&!(d.review)){document.getElementById("loading").innerHTML=d.message;return}
  document.getElementById("loading").style.display="none";
  document.getElementById("finished").style.display="block";
  var pct=d.max_score>0?Math.round(d.total_score/d.max_score*100):0;
  var grade=pct>=90?"A":pct>=80?"B":pct>=70?"C":pct>=60?"D":"E";
  var scoreHtml="";
  if(d.show_score){
    scoreHtml="<div class='result-hero'><h2>📊 Hasil Ujian</h2><div class='result-score'>"+d.total_score+"<span class='max'> / "+d.max_score+"</span></div><div style='font-size:18px;opacity:.9'>Nilai: "+pct+" ("+grade+")</div><div class='result-meta'><span>📝 "+d.exam_title+"</span><span>👤 "+(d.nama||"")+"</span><span>🏫 "+(d.kelas||"")+"</span></div></div><div class='result-stats'><div class='result-stat correct'><div class='num'>"+d.correct+"</div><div class='lbl'>Benar</div></div><div class='result-stat wrong'><div class='num'>"+d.wrong+"</div><div class='lbl'>Salah</div></div><div class='result-stat empty'><div class='num'>"+d.empty+"</div><div class='lbl'>Kosong</div></div></div>";
  }else{
    scoreHtml="<div class='result-hero'><h2>📊 Hasil Ujian</h2><p>Ujian telah diselesaikan.</p><div class='result-meta'><span>📝 "+d.exam_title+"</span><span>👤 "+(d.nama||"")+"</span></div></div>";
  }
  var actionsHtml="<div class='result-actions'><a href='/cbt/' class='primary'>Kembali ke CBT</a></div>";
  document.getElementById("finished").innerHTML="<div class='q-container'>"+scoreHtml+buildReview(d)+actionsHtml+"</div>";
}catch(e){document.getElementById("loading").innerHTML="Gagal memuat hasil: "+e.message}
}

init();
</script>
{{ end }}
